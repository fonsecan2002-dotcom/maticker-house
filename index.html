</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{--azul:#1e3a8a;--azul2:#2563eb;--azul3:#3b82f6;--naranja:#f59e0b;--fondo:#f0f4f8;--borde:#e2e8f0;--texto:#1f2937;--suave:#6b7280;--sombra:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);--sombra-hover:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.08);--sombra-tarjeta:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--gradiente:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#3b82f6 100%);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);overflow-x:hidden;}

  /* === HEADER === */
  header{display:flex;justify-content:space-between;align-items:center;background:var(--gradiente);padding:18px 28px;box-shadow:0 4px 15px rgba(30,58,138,.25);position:sticky;top:0;z-index:100;}
  header h1{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px;text-shadow:0 1px 3px rgba(0,0,0,.2);}
  header h1::before{content:'📊 ';font-size:20px;}
  #actualizacion{font-size:12px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;backdrop-filter:blur(4px);}

  /* === LAYOUT === */
  .layout{display:flex;min-height:calc(100vh - 62px);}

  /* === SIDEBAR === */
  aside{width:220px;background:#fff;padding:20px 16px;border-right:1px solid var(--borde);box-shadow:2px 0 8px rgba(0,0,0,.03);overflow-y:auto;}
  aside label{display:block;font-size:11px;font-weight:700;color:var(--azul2);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.8px;}
  aside label:first-child{margin-top:4px;}
  aside select{width:100%;padding:9px 10px;border:2px solid var(--borde);border-radius:8px;font-size:13px;font-family:inherit;background:#f8fafc;cursor:pointer;transition:all .2s ease;appearance:auto;color:var(--texto);}
  aside select:hover{border-color:var(--azul3);background:#fff;}
  aside select:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(37,99,235,.15);background:#fff;}

  /* === MAIN === */
  main{flex:1;padding:24px;max-width:calc(100% - 220px);animation:fadeIn .5s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  /* === TABS === */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tabs button{padding:10px 24px;border:2px solid var(--borde);background:#fff;border-radius:25px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
  .tabs button:hover{transform:translateY(-2px);box-shadow:var(--sombra);border-color:var(--azul3);}
  .tabs button.activo{background:var(--gradiente);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,.35);transform:translateY(-1px);}
  .tabs button.activo:hover{box-shadow:0 6px 16px rgba(37,99,235,.4);transform:translateY(-3px);}

  /* === TARJETAS KPI === */
  .tarjetas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:22px 18px;text-align:center;box-shadow:var(--sombra-tarjeta);transition:all .35s cubic-bezier(.4,0,.2,1);cursor:default;position:relative;overflow:hidden;animation:slideUp .5s ease both;}
  .tarjeta:nth-child(1){animation-delay:.1s}
  .tarjeta:nth-child(2){animation-delay:.2s}
  .tarjeta:nth-child(3){animation-delay:.3s}
  .tarjeta::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:14px 14px 0 0;}
  .tarjeta:nth-child(1)::before{background:linear-gradient(90deg,#059669,#10b981);}
  .tarjeta:nth-child(2)::before{background:linear-gradient(90deg,#dc2626,#ef4444);}
  .tarjeta:nth-child(3)::before{background:linear-gradient(90deg,#d97706,#f59e0b);}
  .tarjeta:hover{transform:translateY(-6px) scale(1.02);box-shadow:var(--sombra-hover);border-color:transparent;}
  .tarjeta .valor{font-size:28px;font-weight:800;background:var(--gradiente);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:4px;}
  .tarjeta .etiqueta{font-size:12px;color:var(--suave);margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}

  /* === PANELES === */
  .panel{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:var(--sombra-tarjeta);transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
  .panel:hover{box-shadow:var(--sombra-hover);transform:translateY(-3px);border-color:rgba(37,99,235,.15);}
  .panel h3{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--azul);display:flex;align-items:center;gap:8px;}
  .panel h3::before{content:'';display:inline-block;width:4px;height:18px;background:var(--gradiente);border-radius:3px;}
  canvas{max-height:280px;}

  /* === GRAFICAS GRID === */
  .graficas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px;}
  .graficas-grid .panel{margin-bottom:0;animation:slideUp .5s ease both;}
  .graficas-grid .panel:nth-child(1){animation-delay:.15s}
  .graficas-grid .panel:nth-child(2){animation-delay:.25s}
  .graficas-grid .panel:nth-child(3){animation-delay:.35s}
  .graficas-grid .panel:nth-child(4){animation-delay:.45s}

  /* === TABLA === */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  thead{position:sticky;top:0;z-index:1;}
  th{padding:10px 10px;background:linear-gradient(135deg,#f8fafc,#f1f5f9);color:var(--azul);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--borde);}
  td{padding:8px 10px;border-bottom:1px solid #f1f5f9;transition:background .15s ease;}
  tr:hover td{background:#f0f7ff;}
  td input{width:95px;padding:5px 8px;border:2px solid var(--borde);border-radius:6px;font-family:inherit;font-size:13px;transition:all .2s ease;}
  td input:hover{border-color:var(--azul3);}
  td input:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(37,99,235,.12);}

  /* === BADGES ESTADO === */
  .estado-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;}
  .estado-gestionada{background:#dcfce7;color:#166534;}
  .estado-pendiente{background:#fef3c7;color:#92400e;}
  .estado-en-gestion{background:#dbeafe;color:#1e40af;}

  /* === BOTONES ACCION === */
  .acciones{display:flex;gap:10px;margin-bottom:14px;}
  .acciones button{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
  .btn-guardar{background:var(--gradiente);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25);}
  .btn-guardar:hover{box-shadow:0 4px 16px rgba(37,99,235,.35);transform:translateY(-2px);}
  .btn-guardar:active{transform:translateY(0);box-shadow:0 1px 4px rgba(37,99,235,.2);}
  .btn-reset{background:#f1f5f9;color:var(--texto);border:1px solid var(--borde);}
  .btn-reset:hover{background:#e2e8f0;transform:translateY(-2px);box-shadow:var(--sombra);}
  .tabla-wrap{max-height:380px;overflow:auto;border-radius:10px;border:1px solid var(--borde);}
  .tabla-wrap::-webkit-scrollbar{width:6px;height:6px;}

let datos = null;      // datos originales o restaurados de localStorage
let tipoActual = "no_venta";
let chartEvo, chartTop, chartNegocio, chartMarca, chartCanal;
const fmt = v => "$ " + new Intl.NumberFormat('es-CO',{maximumFractionDigits:1}).format(v/1e6) + " M";

async function cargarDatos() {
  const guardado = localStorage.getItem("maticker_datos");
  if (guardado) { datos = JSON.parse(guardado); return; }
  datos = JSON.parse(JSON.stringify(DATOS_EMBEBIDOS));
}

let negocioCanal = {}; // negocio -> lista de canales válidos para ese negocio

function construirRelacionNegocioCanal() {
  [...datos.no_venta, ...datos.devolucion].forEach(r => {
    if (!negocioCanal[r.negocio]) negocioCanal[r.negocio] = new Set();
    negocioCanal[r.negocio].add(r.canal);
  });
}

function llenarSelect(id, valores) {
  const sel = document.getElementById(id);
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todas</option>';
  valores.forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
  if (valores.includes(actual)) sel.value = actual;
}

function actualizarCanalesSegunNegocio() {
  const negocio = document.getElementById('f_negocio').value;
  const canales = negocio ? [...negocioCanal[negocio]].sort() : datos.filtros.canal;
  llenarSelect('f_canal', canales);
}

function llenarFiltros() {
  construirRelacionNegocioCanal();
  const mapa = {f_anio_mes:"anio_mes", f_negocio:"negocio", f_oficina:"oficina", f_marca:"marca"};
  for (const [id, campo] of Object.entries(mapa)) {
    llenarSelect(id, datos.filtros[campo]);
    document.getElementById(id).addEventListener('change', render);
  }
  llenarSelect('f_canal', datos.filtros.canal);
  document.getElementById('f_negocio').addEventListener('change', actualizarCanalesSegunNegocio);
  document.getElementById('f_canal').addEventListener('change', render);
}

function filtrosActivos() {
  return {
    anio_mes: document.getElementById('f_anio_mes').value,
    negocio: document.getElementById('f_negocio').value,
    canal: document.getElementById('f_canal').value,
    oficina: document.getElementById('f_oficina').value,
    marca: document.getElementById('f_marca').value,
  };
}

function aplicaFiltro(fila, f) {
  return (!f.anio_mes || fila.anio_mes===f.anio_mes) && (!f.negocio || fila.negocio===f.negocio) &&
         (!f.canal || fila.canal===f.canal) && (!f.oficina || fila.oficina===f.oficina) && (!f.marca || fila.marca===f.marca);
}

function cambiarTipo(t) {
  tipoActual = t;
  document.getElementById('tab_nv').classList.toggle('activo', t==='no_venta');
  document.getElementById('tab_dv').classList.toggle('activo', t==='devolucion');
  render();
}

function render() {
  const f = filtrosActivos();
  const filas = datos[tipoActual].filter(r => aplicaFiltro(r, f));
  const totalIndicador = filas.reduce((s,r)=>s+r.valor, 0);

  const ventaMes = f.anio_mes
    ? (datos.venta_mensual.find(v=>v.anio_mes===f.anio_mes)?.valor || 0)
    : datos.venta_mensual.reduce((s,v)=>s+v.valor,0);

  const pct = ventaMes ? (totalIndicador/ventaMes*100) : 0;
  const esNV = tipoActual === 'no_venta';
  document.getElementById('kpi_ind_lbl').textContent = esNV ? 'No venta' : 'Devolución';
  document.getElementById('kpi_pct_lbl').textContent = esNV ? '% No venta' : '% Devolución';
  document.getElementById('titulo_evo').textContent = 'Evolución mensual de ' + (esNV ? 'la no venta' : 'las devoluciones');
  const labelTipo = esNV ? 'no venta' : 'devolución';
  document.getElementById('titulo_top_oficina').textContent = 'TOP 5 ' + labelTipo + ' por oficina';
  document.getElementById('titulo_top_negocio').textContent = 'TOP 5 ' + labelTipo + ' por negocio';
  document.getElementById('titulo_top_marca').textContent = 'TOP 5 ' + labelTipo + ' por marca';
  document.getElementById('titulo_top_canal').textContent = (esNV ? 'No venta' : 'Devolución') + ' por canal';
  document.getElementById('kpi_venta').textContent = fmt(ventaMes);
  document.getElementById('kpi_ind').textContent = fmt(totalIndicador);
  document.getElementById('kpi_pct').textContent = pct.toFixed(2) + ' %';

  // Evolución mensual (usa todas las filas del tipo, sin filtro de mes, respetando el resto de filtros)
  const fSinMes = {...f, anio_mes: ""};
  const porMes = {};
  datos[tipoActual].filter(r=>aplicaFiltro(r,fSinMes)).forEach(r=>{ porMes[r.anio_mes]=(porMes[r.anio_mes]||0)+r.valor; });
  const meses = datos.venta_mensual.map(v=>v.anio_mes);
  const valoresMes = meses.map(m=>porMes[m]||0);

  // Config global de tooltips y animaciones
  const tooltipConfig = {
    backgroundColor:'rgba(30,58,138,.92)',
    titleFont:{family:'Inter',size:13,weight:'600'},
    bodyFont:{family:'Inter',size:12},
    padding:12,
    cornerRadius:10,
    displayColors:true,
    boxPadding:4,
    callbacks:{label:ctx=> ' ' + fmt(ctx.raw)}
  };
  const animConfig = {duration:800, easing:'easeOutQuart'};

  if (chartEvo) chartEvo.destroy();
  const ctxEvo = document.getElementById('chart_evo').getContext('2d');
  const gradEvo = ctxEvo.createLinearGradient(0,0,0,280);
  gradEvo.addColorStop(0,'#2563eb');
  gradEvo.addColorStop(1,'#1e3a8a');
  chartEvo = new Chart(ctxEvo, {
    type:'bar',
    data:{ labels:meses, datasets:[{label:'Valor', data:valoresMes, backgroundColor:gradEvo, hoverBackgroundColor:'#3b82f6', borderRadius:6, borderSkipped:false}] },
    options:{
      responsive:true,
      animation:animConfig,
      plugins:{legend:{display:false}, tooltip:tooltipConfig},
      scales:{
        y:{ticks:{callback:v=>fmt(v), font:{family:'Inter',size:11}}, grid:{color:'rgba(0,0,0,.04)'}},
        x:{ticks:{font:{family:'Inter',size:11}}, grid:{display:false}}
      },
      onHover:(event,elements)=>{event.native.target.style.cursor=elements.length?'pointer':'default';}
    }
  });

  // Helper para crear gráficas TOP horizontales con gradientes
  const paleta = [
    ['#2563eb','#60a5fa'],['#7c3aed','#a78bfa'],['#db2777','#f472b6'],
    ['#ea580c','#fb923c'],['#059669','#34d399'],['#0891b2','#22d3ee'],
    ['#d97706','#fbbf24'],['#4f46e5','#818cf8']
  ];

  function crearChartTop(canvasId, datos_agrupados, colorIdx, limite) {
    const top = Object.entries(datos_agrupados).sort((a,b)=>b[1]-a[1]).slice(0, limite || 5);
    const ctx = document.getElementById(canvasId).getContext('2d');
    const bgColors = top.map((_,i)=>{
      const g = ctx.createLinearGradient(0,0,ctx.canvas.width,0);
      const c = paleta[(colorIdx + i) % paleta.length];
      g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
      return g;
    });
    return new Chart(ctx, {
      type:'bar',
      data:{ labels:top.map(x=>x[0]), datasets:[{label:'Valor', data:top.map(x=>x[1]), backgroundColor:bgColors, hoverBackgroundColor:top.map((_,i)=>paleta[(colorIdx+i)%paleta.length][1]), borderRadius:6, borderSkipped:false}] },
      options:{
        indexAxis:'y', responsive:true,
        animation:animConfig,
        plugins:{legend:{display:false}, tooltip:tooltipConfig},
        scales:{
          x:{ticks:{callback:v=>fmt(v), font:{family:'Inter',size:11}}, grid:{color:'rgba(0,0,0,.04)'}},
          y:{ticks:{font:{family:'Inter',size:12,weight:'500'}}, grid:{display:false}}
        },
        onHover:(event,elements)=>{event.native.target.style.cursor=elements.length?'pointer':'default';}
      }
    });
  }

  // TOP 5 oficina
  const porOf = {};
  filas.forEach(r=>{ porOf[r.oficina]=(porOf[r.oficina]||0)+r.valor; });
  if (chartTop) chartTop.destroy();
  chartTop = crearChartTop('chart_top', porOf, 0);

  // TOP 5 negocio
  const porNeg = {};
  filas.forEach(r=>{ porNeg[r.negocio]=(porNeg[r.negocio]||0)+r.valor; });
  if (chartNegocio) chartNegocio.destroy();
  chartNegocio = crearChartTop('chart_negocio', porNeg, 1);

  // TOP 5 marca
  const porMarca = {};
  filas.forEach(r=>{ porMarca[r.marca]=(porMarca[r.marca]||0)+r.valor; });
  if (chartMarca) chartMarca.destroy();
  chartMarca = crearChartTop('chart_marca', porMarca, 2);

  // Por canal (todos)
  const porCanal = {};
  filas.forEach(r=>{ porCanal[r.canal]=(porCanal[r.canal]||0)+r.valor; });
  if (chartCanal) chartCanal.destroy();
  const topCanal = Object.entries(porCanal).sort((a,b)=>b[1]-a[1]);
  const ctxCanal = document.getElementById('chart_canal').getContext('2d');
  const bgCanal = topCanal.map((_,i)=>{
    const g = ctxCanal.createLinearGradient(0,0,ctxCanal.canvas.width,0);
    const c = paleta[i % paleta.length];
    g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
    return g;
  });
  chartCanal = new Chart(ctxCanal, {
    type:'bar',
    data:{ labels:topCanal.map(x=>x[0]), datasets:[{label:'Valor', data:topCanal.map(x=>x[1]), backgroundColor:bgCanal, hoverBackgroundColor:topCanal.map((_,i)=>paleta[i%paleta.length][1]), borderRadius:6, borderSkipped:false}] },
    options:{
      indexAxis:'y', responsive:true,
      animation:animConfig,
      plugins:{legend:{display:false}, tooltip:tooltipConfig},
      scales:{
        x:{ticks:{callback:v=>fmt(v), font:{family:'Inter',size:11}}, grid:{color:'rgba(0,0,0,.04)'}},
        y:{ticks:{font:{family:'Inter',size:12,weight:'500'}}, grid:{display:false}}
      },
      onHover:(event,elements)=>{event.native.target.style.cursor=elements.length?'pointer':'default';}
    }
  });

  renderTabla(filas);
}

function estadoBadge(estado) {
  const clases = {
    'Gestionada': 'estado-badge estado-gestionada',
    'Pendiente': 'estado-badge estado-pendiente',
    'En gestión': 'estado-badge estado-en-gestion'
  };
  return `<span class="${clases[estado] || 'estado-badge'}">${estado}</span>`;
}

function renderTabla(filas) {
  const tbody = document.getElementById('tabla_body');
  tbody.innerHTML = "";
  filas.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.anio_mes}</td><td>${r.oficina}</td><td>${r.negocio}</td><td>${r.canal}</td><td>${r.marca}</td><td>${r.motivo}</td>
      <td><input type="number" value="${r.unidades}" onchange="editarCampo(${r.id},'unidades',this.value)"></td>
      <td><input type="number" value="${r.valor}" onchange="editarCampo(${r.id},'valor',this.value)"></td>
      <td>${estadoBadge(r.estado)}</td>`;
    tbody.appendChild(tr);
  });
}

function editarCampo(id, campo, valor) {
  const fila = datos[tipoActual].find(r => r.id === id);
  if (fila) fila[campo] = Number(valor);
  render();
}

function guardarCambios() {
  localStorage.setItem("maticker_datos", JSON.stringify(datos));
  alert("Cambios guardados en este navegador.");
}

async function restablecerDatos() {
  localStorage.removeItem("maticker_datos");
  datos = JSON.parse(JSON.stringify(DATOS_EMBEBIDOS));
  render();
  alert("Datos originales restaurados.");
}

(async function iniciar(){
  await cargarDatos();
  document.getElementById('actualizacion').textContent = "Actualización: " + datos.actualizacion;
  llenarFiltros();
  render();
})();
</script>
